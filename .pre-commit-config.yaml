repos:
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2
  # Code only: addlicense has no comment syntax for Markdown, so entries carry
  # their CC-BY-SA-4.0 claim in README.md and LICENSE-CC-BY-SA instead.
  - repo: https://github.com/google/addlicense
    rev: v1.2.0
    hooks:
      - id: addlicense
        args:
          - -c
          - Steven Kearnes
          - -l
          - apache
  - repo: local
    hooks:
      - id: check-metadata
        name: check entry metadata
        entry: python3 .github/scripts/check_metadata.py
        language: system
        files: ^entries/.*\.md$
        # The checker walks every entry itself.
        pass_filenames: false
